<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RecToom - Home</title>
    <style>
        body {
            background-color: #000;
            color: #00ff66;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }
        header {
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            border-bottom: 2px solid #00ff66;
        }
        h1 {
            font-size: 48px;
            margin-top: 40px;
        }
        p {
            font-size: 22px;
            opacity: 0.8;
            margin-bottom: 40px;
        }
        .btn {
            background-color: #00ff66;
            color: #000;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin: 15px;
        }
        .lang-btn {
            background-color: transparent;
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
        footer {
            margin-top: 60px;
            padding: 20px;
            font-size: 14px;
            opacity: 0.7;
            border-top: 2px solid #00ff66;
        }
    </style>
</head>
<body>

<header>
    RecToom — Home
</header>

<!-- Language Buttons -->
<div>
    <button class="lang-btn" id="frBtn">FR</button>
    <button class="lang-btn" id="enBtn">EN</button>
</div>

<h1 id="title">Bienvenue sur RecToom</h1>
<p id="subtitle">Une nouvelle génération de jeu social.</p>

<!-- Main Buttons -->
<a class="btn" id="aboutBtn" href="about.html">À propos</a>
<a class="btn" id="discordBtn" href="https://discord.gg/eWxJncTr2j">Rejoindre le Discord</a>
<a class="btn" id="enterBtn" href="download.html">Entrer dans RecToom</a>

<!-- Login / Register -->
<div>
    <a class="btn" id="loginBtn" href="login.html">Se connecter</a>
    <a class="btn" id="registerBtn" href="register.html">S'inscrire</a>
</div>

<footer id="footer">
    RecToom © 2026 — Propulsé par Nexora
</footer>

<script type="module">
    import { setGlobalLang } from "./main.js";

    // Default language
    setGlobalLang("fr");

    // Language switch buttons
    document.getElementById("frBtn").onclick = () => setGlobalLang("fr");
    document.getElementById("enBtn").onclick = () => setGlobalLang("en");
</script>

</body>
</html>
