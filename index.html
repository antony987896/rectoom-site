<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RecToom</title>
    <style>
        body {
            background-color: #000;
            color: #00ff66;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }
        header {
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            border-bottom: 2px solid #00ff66;
        }
        .btn {
            background-color: #00ff66;
            color: #000;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            margin: 10px;
        }
        footer {
            margin-top: 60px;
            padding: 20px;
            font-size: 14px;
            opacity: 0.7;
            border-top: 2px solid #00ff66;
        }
    </style>
</head>
<body>

<header>
    RecToom
</header>

<!-- Boutons Login / Register -->
<div style="margin-top: 20px;">
    <a class="btn" href="login.html" id="loginBtn">Se connecter</a>
    <a class="btn" href="register.html" id="registerBtn">S'inscrire</a>
</div>

<!-- Boutons langue -->
<div style="margin-top: 10px;">
    <button class="btn" id="langEN">English</button>
    <button class="btn" id="langFR">Français</button>
</div>

<h1 id="title">Bienvenue sur RecToom</h1>
<p id="subtitle">Une nouvelle génération de jeu social.</p>

<div style="margin-top: 40px;">
    <a class="btn" id="enterBtn" href="#">Entrer dans RecToom</a>
    <a class="btn" id="discordBtn" href="#">Rejoindre le Discord</a>
    <a class="btn" id="aboutBtn" href="#">À propos</a>
</div>

<footer id="footer">
    RecToom © 2026 — Propulsé par Nexora
</footer>

<!-- Import du module principal -->
<script type="module">
    import { setLang } from "./main.js";

    // Boutons langue
    document.getElementById("langEN").addEventListener("click", () => setLang("en"));
    document.getElementById("langFR").addEventListener("click", () => setLang("fr"));

    // Langue par défaut
    setLang("fr");
</script>

</body>
</html>
