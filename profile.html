<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RecToom - Profil</title>
    <style>
        body {
            background-color: #000;
            color: #00ff66;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: #0a0a0a;
            border: 2px solid #00ff66;
            border-radius: 12px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 0 20px #00ff66;
        }

        header {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .lang-btn {
            background-color: transparent;
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }

        .btn {
            background-color: #00ff66;
            color: #000;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            margin-top: 25px;
        }

        #userEmail {
            font-size: 18px;
            margin-top: 10px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="card">
    <header>RecToom — Profil</header>

    <!-- Language Buttons -->
    <div>
        <button class="lang-btn" id="langEN">EN</button>
        <button class="lang-btn" id="langFR">FR</button>
    </div>

    <h1 id="title">Bienvenue !</h1>
    <p id="userEmail">Chargement...</p>

    <div class="btn" id="logoutBtn">Se déconnecter</div>
</div>

<script type="module">
    import { logout, setGlobalLang } from "./main.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const auth = getAuth();

    // Default language
    setGlobalLang("fr");

    // Language Switch
    document.getElementById("langEN").addEventListener("click", () => {
        setGlobalLang("en");
        document.getElementById("title").innerText = "Welcome!";
        document.getElementById("logoutBtn").innerText = "Logout";
    });

    document.getElementById("langFR").addEventListener("click", () => {
        setGlobalLang("fr");
        document.getElementById("title").innerText = "Bienvenue !";
        document.getElementById("logoutBtn").innerText = "Se déconnecter";
    });

    // Auth Protection
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "index.html";
        } else {
            document.getElementById("userEmail").innerText =
                "Connecté en tant que : " + user.email;
        }
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
        logout().then(() => {
            window.location.href = "index.html";
        });
    });
</script>

</body>
</html>
