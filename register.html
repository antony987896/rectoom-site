<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RecToom - S'inscrire</title>
    <style>
        body {
            background-color: #000;
            color: #00ff66;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }
        header {
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            border-bottom: 2px solid #00ff66;
        }
        .content {
            padding: 60px 20px;
            max-width: 400px;
            margin: auto;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        .btn {
            background-color: #00ff66;
            color: #000;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
        }
        footer {
            margin-top: 60px;
            padding: 20px;
            font-size: 14px;
            opacity: 0.7;
            border-top: 2px solid #00ff66;
        }
    </style>
</head>
<body>

<header>
    RecToom — S'inscrire
</header>

<div class="content">
    <h1 id="title">Créer un compte</h1>

    <input type="text" id="username" placeholder="Nom d'utilisateur">
    <input type="email" id="email" placeholder="Adresse email">
    <input type="password" id="password" placeholder="Mot de passe">

    <div class="btn" onclick="notAvailable()" id="registerBtn">S'inscrire</div>

    <br><br>
    <a class="btn" href="index.html">← Retour</a>
</div>

<footer id="footer">
    RecToom © 2026 — Propulsé par Nexora
</footer>

<script>
function notAvailable() {
    alert("La création de compte n'est pas encore disponible.");
}
</script>

</body>
</html>
